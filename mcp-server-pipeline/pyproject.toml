[project]
name = "britive-jit-pipeline-mcp"
version = "0.1.0"
description = "MCP server: Claude reads the nightly multi-cloud JIT batch, as itself or on behalf of a human."
requires-python = ">=3.10"
dependencies = [
    # Pinned below 2.0: mcp 2.x removed `mcp.server.fastmcp`, which this server
    # imports. The sibling mcp-server/ runs 1.27.1 — keep the two in step.
    "mcp>=1.2.0,<2",
    "britive>=2.20.0",
    "boto3>=1.34.0",
]

# No GCP/Azure extras: this server reads AWS only. The workflow still writes
# the same batch to GCS and Azure Blob, but the live demo reads one cloud for
# speed, and AWS is the only one with a proven on-behalf-of path.

[tool.uv]
package = false

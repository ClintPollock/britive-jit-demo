[project]
name = "britive-jit-pipeline-mcp"
version = "0.1.0"
description = "MCP server: Claude reads the nightly multi-cloud JIT batch, as itself or on behalf of a human."
requires-python = ">=3.10"
dependencies = [
    # Pinned below 2.0: mcp 2.x removed `mcp.server.fastmcp`, which this server
    # imports. The sibling mcp-server/ runs 1.27.1 — keep the two in step.
    "mcp>=1.2.0,<2",
    "britive>=2.20.0",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
]

# No Azure extra: the workflow writes the batch to Azure Blob, but there is no
# reader profile for it and the Azure app cannot scope a profile below the
# subscription, so the read demo covers AWS and GCP only.

[tool.uv]
package = false

name: britive-jit-demo

# Generic JIT demo: GitHub OIDC -> Britive (federated SI) -> AWS + GCP + Azure
# with no static credentials anywhere in this repo.
#
# To reuse this for your own Britive tenant, change the env vars below.
# No GitHub Secrets required.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Nightly at 07:00 UTC. This is the unattended half of the demo: no human,
    # no static credential, three clouds written by three JIT identities that
    # exist for the length of the job. The agent/MCP half then READS what this
    # produced - see "The nightly drop" in the README.
    - cron: '0 7 * * *'

permissions:
  id-token: write
  contents: read

env:
  # === Britive tenant ====================================================
  BRITIVE_TENANT: cpollock-tenant                    # <- your tenant slug
  BRITIVE_FED_PROVIDER: github-britive-cpollock      # <- "github-<allowed-audience>" (matches your Britive OIDC IdP)
  # === Profile paths (use `pybritive ls profiles` to find yours) =========
  AWS_PROFILE_PATH: 'AWS Standalone/0299-CP/CP-Admin-Profile'
  GCP_PROFILE: 'Google Cloud/Google Cloud/cpollock-pov-gcs-admin'
  AZURE_PROFILE_PATH: 'Azure BritiveSE/Azure BritiveSE/cpollock-pov-azure-blob-writer'
  # === Demo targets — ALL FIXED INFRA, created once, out of band =========
  #     Nothing here self-creates a bucket. That is deliberate: the JIT
  #     profiles are data-plane grants, and the denied control-plane write in
  #     the Azure job is a proof step. Symmetry across the three clouds keeps
  #     that claim honest. Create these once by hand if you are forking this.
  S3_BUCKET: britive-jit-demo-696226360299
  GCS_BUCKET: britive-jit-demo-1095450080757
  AZURE_STORAGE_ACCOUNT: britivejitdemo4bbb4f1c
  AZURE_CONTAINER: jit-demo
  # === Where the nightly batch lands (same layout in all three clouds) ===
  #     daily/<YYYY-MM-DD>.csv           the batch itself (identical bytes
  #                                      in all three clouds — see below)
  #     daily/<YYYY-MM-DD>.manifest.json per-cloud: who wrote it, which run
  DAILY_PREFIX: daily
  GCP_PROJECT_ID: cpollock-poc-core
  AWS_REGION: us-east-1     # read implicitly by the aws CLI
  AZURE_REGION: eastus2     # used only by the deliberately-denied `az group create`

jobs:

  # =========================================================================
  # AWS — checkout AWS profile via Britive, write per-run file to S3
  # =========================================================================
  aws-jit-write:
    name: AWS JIT write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve batch date
        run: echo "BATCH_DATE=$(date -u +%F)" >> $GITHUB_ENV

      - name: Install pybritive
        run: pip install --quiet pybritive

      - name: Britive checkout (GitHub OIDC -> Britive -> AWS)
        run: |
          # env-nix emits `export AWS_*="value"` lines (plus a KUBECONFIG warning).
          # Filter to only AWS_* exports, then source.
          pybritive checkout "$AWS_PROFILE_PATH" \
            --federation-provider "$BRITIVE_FED_PROVIDER" \
            --silent --mode env-nix \
            | grep -E '^export AWS_' > /tmp/aws.env
          set -a; source /tmp/aws.env; set +a
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
          } >> $GITHUB_ENV

      - name: Verify auth
        run: aws sts get-caller-identity

      - name: Generate today's intake batch
        run: |
          python3 scripts/gen-intake.py \
            --date "$BATCH_DATE" \
            --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json \
            --cloud aws \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --written-by "$(aws sts get-caller-identity --query Arn --output text)"

      - name: Write the batch to S3 (the thing the agent will read)
        run: |
          aws s3 cp /tmp/intake.csv \
            "s3://${S3_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.csv"
          aws s3 cp /tmp/intake.manifest.json \
            "s3://${S3_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.manifest.json"
          echo "::notice::Wrote s3://${S3_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.csv"

      - name: List recent batches (proof the pipeline runs nightly)
        run: |
          echo "Last 10 batches in s3://${S3_BUCKET}/${DAILY_PREFIX}/:"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "${DAILY_PREFIX}/" \
            --query 'reverse(sort_by(Contents,&LastModified))[:10].[LastModified,Size,Key]' \
            --output table

      - name: Write per-run file to S3
        run: |
          cat > /tmp/payload.txt <<EOF
          Britive JIT demo (AWS)
          ========================
          run_id:        ${{ github.run_id }}
          repo:          ${{ github.repository }}
          ref:           ${{ github.ref }}
          actor:         ${{ github.actor }}
          commit:        ${{ github.sha }}
          time:          $(date -u +%Y-%m-%dT%H:%M:%SZ)
          auth_path:     GitHub OIDC -> Britive (federated SI) -> AWS profile
          static_creds:  none
          EOF
          aws s3 cp /tmp/payload.txt "s3://${S3_BUCKET}/jit-demo/aws-run-${{ github.run_id }}.txt"
          echo "::notice::Wrote s3://${S3_BUCKET}/jit-demo/aws-run-${{ github.run_id }}.txt"

      - name: List recent files (proof of past runs)
        run: |
          echo "Last 10 files in s3://${S3_BUCKET}/jit-demo/:"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix jit-demo/ \
            --query 'reverse(sort_by(Contents,&LastModified))[:10].[LastModified,Size,Key]' \
            --output table

      - name: Britive checkin
        if: always()
        run: pybritive checkin "$AWS_PROFILE_PATH" || true

  # =========================================================================
  # GCP — checkout storage profile via Britive, write the batch to GCS
  #
  # HISTORY (so nobody re-diagnoses this): this job failed for months with
  # 403s that looked like a Britive shadow-SA role-binding bug. It was not.
  # The real cause was that project cpollock-poc-core was linked to a CLOSED
  # billing account, so Google refused the write at the billing layer:
  #   AccessDeniedException: 403 The billing account for the owning project
  #   is disabled in state closed
  # Relinked to an open billing account 2026-08-08 and verified with a real
  # write+delete. The Britive checkout path was working the whole time.
  # =========================================================================
  gcp-jit-write:
    name: GCP JIT write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve batch date
        run: echo "BATCH_DATE=$(date -u +%F)" >> $GITHUB_ENV

      - name: Install pybritive
        run: pip install --quiet pybritive

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Britive checkout (GitHub OIDC -> Britive -> GCP)
        run: |
          # WIF profiles only support `-m json` (returns {sa_email: keyJson_str}).
          # Unwrap to the inner SA key JSON and feed it to gcloud.
          mkdir -p ~/.gcp
          pybritive configure update profile-aliases gcp-default "$GCP_PROFILE"
          pybritive checkout gcp-default -m json -P "$BRITIVE_FED_PROVIDER" --silent | \
            python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); sys.stdout.write(list(d.values())[0])' \
            > ~/.gcp/sa-key.json
          test -s ~/.gcp/sa-key.json || { echo "::error::Empty SA key file"; exit 1; }
          # Newly-minted SA keys take a few seconds to be usable; retry activate.
          for i in 1 2 3 4 5; do
            if gcloud auth activate-service-account --key-file=$HOME/.gcp/sa-key.json 2>&1; then
              break
            fi
            echo "Activate attempt $i failed (likely SA key not yet propagated); waiting 5s..."
            sleep 5
          done
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Wait for IAM propagation
        # Britive attaches roles/storage.admin at folder scope on checkout, but Google's
        # IAM evaluation cache for newly-created SAs is slow to recognize the binding.
        # Local test (token-based SI): ~30s. GH Actions (federated SI): seems longer.
        run: sleep 90

      - name: Generate today's intake batch
        run: |
          python3 scripts/gen-intake.py \
            --date "$BATCH_DATE" \
            --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json \
            --cloud gcp \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --written-by "$(gcloud config get-value account 2>/dev/null)"

      - name: Write the batch to GCS (the thing the agent will read)
        run: |
          gsutil cp /tmp/intake.csv \
            "gs://${GCS_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.csv"
          gsutil cp /tmp/intake.manifest.json \
            "gs://${GCS_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.manifest.json"
          echo "::notice::Wrote gs://${GCS_BUCKET}/${DAILY_PREFIX}/${BATCH_DATE}.csv"

      - name: List recent batches (proof the pipeline runs nightly)
        run: |
          echo "Last 10 batches in gs://${GCS_BUCKET}/${DAILY_PREFIX}/:"
          gsutil ls -l "gs://${GCS_BUCKET}/${DAILY_PREFIX}/**" 2>/dev/null | sort -r | head -10 || true

      - name: Write per-run file to GCS
        run: |
          cat > /tmp/payload.txt <<EOF
          Britive JIT demo (GCP)
          ========================
          run_id:        ${{ github.run_id }}
          repo:          ${{ github.repository }}
          ref:           ${{ github.ref }}
          actor:         ${{ github.actor }}
          commit:        ${{ github.sha }}
          time:          $(date -u +%Y-%m-%dT%H:%M:%SZ)
          auth_path:     GitHub OIDC -> Britive (federated SI) -> GCP profile
          static_creds:  none
          EOF
          gsutil cp /tmp/payload.txt "gs://${GCS_BUCKET}/jit-demo/gcp-run-${{ github.run_id }}.txt"
          echo "::notice::Wrote gs://${GCS_BUCKET}/jit-demo/gcp-run-${{ github.run_id }}.txt"

      - name: List recent files (proof of past runs)
        run: |
          echo "Last 10 files in gs://${GCS_BUCKET}/jit-demo/:"
          gsutil ls -l "gs://${GCS_BUCKET}/jit-demo/**" 2>/dev/null | sort -r | head -10 || true

      - name: Britive checkin
        if: always()
        run: pybritive checkin gcp-default || true

  # =========================================================================
  # Azure — checkout blob-writer profile via Britive, write per-run blob
  #
  # The profile grants ONLY `Storage Blob Data Contributor` at subscription
  # scope: enough to write and read blobs, not enough to touch the control
  # plane. The storage account itself is fixed infrastructure (created once,
  # out of band) — so unlike the AWS/GCP jobs there is no self-create step,
  # and the "create a resource group" attempt below is DENIED on purpose.
  #
  # Britive mints a fresh app registration per checkout, so the service
  # principal client id is different on every run and nothing is long-lived.
  # =========================================================================
  azure-jit-write:
    name: Azure JIT write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve batch date
        run: echo "BATCH_DATE=$(date -u +%F)" >> $GITHUB_ENV

      - name: Install pybritive
        run: pip install --quiet pybritive

      - name: Britive checkout (GitHub OIDC -> Britive -> Azure)
        run: |
          # Azure profiles return {TenantId, ClientId, ClientSecret} in json mode.
          # `-m azlogin` emits a ready-made `az login` line, but it puts the secret
          # on a command line where it can leak into logs — parse json and mask.
          #
          # Azure checkouts intermittently fail with `britive.exceptions.Transaction
          # NotFound`, most reliably on the first attempt after a profile is created
          # or after a recent checkin. It is eventual consistency on Britive's side,
          # not a permissions problem, and it clears on retry — so retry rather than
          # failing the run. Note pybritive prints the exception to STDOUT, so a
          # non-JSON payload is the real failure signal, not just the exit code.
          for i in $(seq 1 6); do
            pybritive checkout "$AZURE_PROFILE_PATH" \
              --federation-provider "$BRITIVE_FED_PROVIDER" \
              --silent -m json > /tmp/az.json 2>/tmp/azerr || true
            if python3 -c "import json,sys; json.load(open('/tmp/az.json'))" 2>/dev/null; then
              echo "Checkout succeeded on attempt $i"
              break
            fi
            echo "attempt $i: $(head -c 120 /tmp/az.json) $(head -c 120 /tmp/azerr)"
            if [ "$i" -eq 6 ]; then
              echo "::error::Britive checkout never returned credentials after 6 attempts"
              exit 1
            fi
            sleep 20
          done
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/az.json'))
          for k in ('TenantId', 'ClientId', 'ClientSecret'):
              print(f"::add-mask::{d[k]}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"AZURE_TENANT_ID={d['TenantId']}\n")
              f.write(f"AZURE_CLIENT_ID={d['ClientId']}\n")
              f.write(f"AZURE_CLIENT_SECRET={d['ClientSecret']}\n")
          PY

      - name: az login (retry while the new role assignment propagates)
        run: |
          # Britive creates a brand-new app registration + role assignment on every
          # checkout, and ARM takes ~30-60s to recognise it. Until then az login
          # fails with "No subscriptions found". Measured locally: OK on attempt 3
          # (~45s). Retry rather than a fixed sleep so fast runs stay fast.
          for i in $(seq 1 12); do
            if az login --service-principal \
                 --tenant "$AZURE_TENANT_ID" \
                 --username "$AZURE_CLIENT_ID" \
                 --password "$AZURE_CLIENT_SECRET" \
                 --output none 2>/tmp/azerr; then
              echo "::notice::az login succeeded on attempt $i (~$((i * 15))s of propagation)"
              exit 0
            fi
            echo "attempt $i: $(head -1 /tmp/azerr)"
            sleep 15
          done
          echo "::error::az login never succeeded — role assignment did not propagate"
          exit 1

      - name: Verify auth (the ephemeral service principal)
        run: |
          az account show --output json
          echo "^ user.name is the JIT service principal — a DIFFERENT client id every run."
          # NOTE: don't add `az role assignment list` here. Storage Blob Data
          # Contributor carries no Microsoft.Authorization read, so it returns an
          # empty table for this identity — which reads as "no grant at all" and
          # tells the exact opposite of the story. The blob write below is the
          # proof that the grant exists; the denied `az group create` is the
          # proof of where it stops.

      - name: Generate today's intake batch
        run: |
          python3 scripts/gen-intake.py \
            --date "$BATCH_DATE" \
            --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json \
            --cloud azure \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --written-by "$(az account show --query user.name --output tsv)"

      - name: Write the batch to Azure Storage (the thing the agent will read)
        run: |
          # --auth-mode login uses the JIT service principal, not an account key.
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --name "${DAILY_PREFIX}/${BATCH_DATE}.csv" \
            --file /tmp/intake.csv \
            --auth-mode login --overwrite --output none
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --name "${DAILY_PREFIX}/${BATCH_DATE}.manifest.json" \
            --file /tmp/intake.manifest.json \
            --auth-mode login --overwrite --output none
          echo "::notice::Wrote ${AZURE_CONTAINER}/${DAILY_PREFIX}/${BATCH_DATE}.csv"

      - name: List recent batches (proof the pipeline runs nightly)
        run: |
          echo "Last 10 batches in ${AZURE_STORAGE_ACCOUNT}/${AZURE_CONTAINER}/${DAILY_PREFIX}/:"
          az storage blob list \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --prefix "${DAILY_PREFIX}/" \
            --auth-mode login \
            --query 'reverse(sort_by([].{Modified:properties.lastModified,Size:properties.contentLength,Name:name},&Modified))[:10]' \
            --output table

      - name: Write per-run blob to Azure Storage
        run: |
          cat > /tmp/payload.txt <<EOF
          Britive JIT demo (Azure)
          ========================
          run_id:        ${{ github.run_id }}
          repo:          ${{ github.repository }}
          ref:           ${{ github.ref }}
          actor:         ${{ github.actor }}
          commit:        ${{ github.sha }}
          time:          $(date -u +%Y-%m-%dT%H:%M:%SZ)
          auth_path:     GitHub OIDC -> Britive (federated SI) -> Azure profile
          service_princ: $(az account show --query user.name --output tsv)
          static_creds:  none
          EOF
          # --auth-mode login uses the JIT service principal, NOT a storage account
          # key. There is no account key anywhere in this workflow.
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --name "azure-run-${{ github.run_id }}.txt" \
            --file /tmp/payload.txt \
            --auth-mode login --overwrite --output none
          echo "::notice::Wrote ${AZURE_STORAGE_ACCOUNT}/${AZURE_CONTAINER}/azure-run-${{ github.run_id }}.txt"

      - name: Read it back
        run: |
          az storage blob download \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --name "azure-run-${{ github.run_id }}.txt" \
            --file /tmp/readback.txt \
            --auth-mode login --output none
          echo "--- blob contents read back from Azure ---"
          cat /tmp/readback.txt
          diff -q /tmp/payload.txt /tmp/readback.txt && echo "Round-trip verified."

      - name: List recent blobs (proof of past runs)
        run: |
          echo "Last 10 blobs in ${AZURE_STORAGE_ACCOUNT}/${AZURE_CONTAINER}/:"
          az storage blob list \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_CONTAINER" \
            --auth-mode login \
            --query 'reverse(sort_by([].{Modified:properties.lastModified,Size:properties.contentLength,Name:name},&Modified))[:10]' \
            --output table

      - name: Prove the grant is scoped (this control-plane write MUST fail)
        run: |
          # The profile is blob-data only. Creating a resource group is a control
          # plane action it has no rights to — a SUCCESS here would mean the
          # profile is over-permissioned, so failure is the passing condition.
          if az group create -n britive-jit-should-fail -l "$AZURE_REGION" --output none 2>/tmp/azwrite; then
            echo "::error::Control-plane write SUCCEEDED — the profile grants more than blob data access"
            az group delete -n britive-jit-should-fail --yes --no-wait || true
            exit 1
          fi
          head -1 /tmp/azwrite
          echo "::notice::Denied as expected — the JIT identity can write blobs and nothing else."

      - name: Britive checkin
        if: always()
        run: |
          # Pass the federation provider here too — the proof step below is only
          # meaningful if this checkin actually lands, so don't blanket-swallow
          # failures. The one tolerable case is "nothing was checked out", which
          # happens when the checkout step itself failed; anything else is real.
          if ! pybritive checkin "$AZURE_PROFILE_PATH" \
               --federation-provider "$BRITIVE_FED_PROVIDER" > /tmp/ci.log 2>&1; then
            cat /tmp/ci.log
            if grep -q "no checked out profile found" /tmp/ci.log; then
              echo "::warning::Nothing was checked out — skipping checkin."
            else
              exit 1
            fi
          fi

      - name: Proof — the JIT grant is gone after checkin
        run: |
          # Britive removes the role assignment on checkin. Measured locally the
          # grant survives ~30-45s, then `az login` fails with "No subscriptions
          # found".
          #
          # TWO caveats, both verified by hand — do not overclaim this on stage:
          #  1. The SECRET may still authenticate to Entra. What is gone is the
          #     ROLE ASSIGNMENT. Say "the grant is revoked", not "the identity
          #     is deleted".
          #  2. Azure does NOT invalidate access tokens that were already issued.
          #     A token minted before checkin keeps working until it expires
          #     (~60-90 min) even though the role assignment is gone. So this
          #     step wipes the token cache first — otherwise `az` happily reuses
          #     the old token and a blob write STILL SUCCEEDS after checkin.
          #     What this proves is that a FRESH authentication gets nothing.
          #
          # TIMING: revocation has been getting slower, and this step FAILS the
          # run if it times out. Measured: ~45s locally, ~105s in CI (run
          # 31255333479), ~120s in CI (run 31310982884 — 8 of 10 attempts).
          # Widened to 20 attempts / 300s so a slow-but-correct revocation does
          # not read as a broken demo. If it ever exhausts even this, suspect
          # something real before widening again.
          rm -rf ~/.azure
          az logout 2>/dev/null || true
          for i in $(seq 1 20); do
            if ! az login --service-principal \
                   --tenant "$AZURE_TENANT_ID" \
                   --username "$AZURE_CLIENT_ID" \
                   --password "$AZURE_CLIENT_SECRET" \
                   --output none 2>/tmp/azdead; then
              head -1 /tmp/azdead
              echo "::notice::Grant revoked ~$((i * 15))s after checkin — a fresh login with the same client id gets nothing."
              exit 0
            fi
            echo "attempt $i: grant still live, waiting for revocation..."
            sleep 15
          done
          echo "::error::Credential still had access 300s after checkin"
          exit 1
